<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-[#f8f9fa]">
    <div class="p-8">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-gray-800">Panneau d'Administration</h1>
            <button onclick="location.href='index.html'" class="bg-gray-200 px-4 py-2 rounded-lg font-medium">Quitter</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Gestion Utilisateurs -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-bold mb-6">Utilisateurs</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-400 border-b">
                                <th class="pb-4 font-medium">Nom</th>
                                <th class="pb-4 font-medium">Rôle</th>
                                <th class="pb-4 font-medium">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr class="py-4">
                                <td class="py-4 font-medium">Jean Dupont</td>
                                <td><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs uppercase">Hôte</span></td>
                                <td><button class="text-red-500 font-bold">Bannir</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Gestion Logements -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-bold mb-6">Modération Logements</h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-4 border rounded-2xl">
                        <div class="flex items-center gap-3">
                            <img src="https://picsum.photos/seed/50/50" class="rounded-lg">
                            <div>
                                <p class="font-bold">Villa Beachfront</p>
                                <p class="text-xs text-green-500">Actif</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" onchange="toggleStatus(this)">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-rose-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleStatus(checkbox) {
            const statusText = checkbox.closest('div').querySelector('.text-xs');
            if(checkbox.checked) {
                statusText.innerText = "Actif";
                statusText.className = "text-xs text-green-500";
            } else {
                statusText.innerText = "Désactivé";
                statusText.className = "text-xs text-red-500";
            }
        }
    </script>
</body>
</html>
