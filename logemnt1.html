<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un logement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Animation pour le menu mobile */
        #mobile-sidebar {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- NAVIGATION MOBILE (Visible uniquement sur petits écrans) -->
    <div class="md:hidden bg-white border-b px-4 py-4 flex justify-between items-center sticky top-0 z-50">
        <h2 class="text-xl font-bold text-rose-500">Mode Hôte</h2>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm font-medium text-gray-600 border-r pr-4">Quitter</a>
            <button id="open-menu" class="text-gray-800 text-2xl focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>

    <div class="flex min-h-screen">
        <!-- SIDEBAR (Desktop & Mobile avec Overlay) -->
        <aside id="mobile-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r p-6 transform -translate-x-full md:translate-x-0 md:relative md:flex flex-col transition-transform duration-300 ease-in-out">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-xl font-bold text-rose-500">Menu</h2>
                <!-- Bouton fermer (Mobile uniquement) -->
                <button id="close-menu" class="md:hidden text-gray-500">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <nav class="space-y-4 flex-1">
                <a href="#" class="flex items-center gap-3 p-3 bg-rose-50 text-rose-600 rounded-xl font-bold">
                    <i class="fa-solid fa-house-chimney"></i> Mes annonces
                </a>
                <a href="#" class="flex items-center gap-3 p-3 text-gray-600 hover:bg-gray-100 rounded-xl transition">
                    <i class="fa-solid fa-calendar-check"></i> Réservations
                </a>
                <a href="index.html" class="flex items-center gap-3 p-3 text-gray-600 hover:bg-gray-100 rounded-xl transition mt-auto">
                    <i class="fa-solid fa-arrow-left-long"></i> Retour Voyageur
                </a>
            </nav>
        </aside>

        <!-- Overlay pour mobile (fond sombre quand le menu est ouvert) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black opacity-50 z-40 hidden md:hidden"></div>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10">
            <div class="max-w-3xl mx-auto">
                <h1 class="text-2xl md:text-3xl font-bold mb-8">Ajouter un nouveau logement</h1>
                
                <form method="POST" enctype="multipart/form-data" action="./../services/addLogementService.php" class="bg-white p-6 md:p-8 rounded-3xl border shadow-sm space-y-6">
                    
                    <!-- Titre -->
                    <div>
                        <label class="block font-medium mb-2">Titre de l'annonce</label>
                        <input type="text" name="titre" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none" placeholder="Ex: Maison de campagne paisible">
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block font-medium mb-2">Description</label>
                        <textarea name="description" required rows="4" class="resize-none w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none" placeholder="Décrivez votre logement en quelques mots..."></textarea>
                    </div>

                    <!-- Ville et Prix -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-medium mb-2">Ville</label>
                            <input type="text" name="ville" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none" placeholder="Ex: Paris">
                        </div>
                        <div>
                            <label class="block font-medium mb-2">Prix par nuit (€)</label>
                            <input type="number" name="prix" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none" placeholder="0.00">
                        </div>
                    </div>

                    <!-- Dates -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-medium mb-2">Date de début</label>
                            <input type="date" name="date_start" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium mb-2">Date de fin</label>
                            <input type="date" name="date_end" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none">
                        </div>
                    </div>

                    <!-- Image -->
                    <div>
                        <label class="block font-medium mb-2">Photo du logement</label>
                        <label id="upload-box" for="file-upload" class="mt-2 flex justify-center rounded-xl border-2 border-dashed border-gray-300 px-6 pt-10 pb-12 hover:border-rose-400 transition bg-gray-50 hover:bg-gray-100 cursor-pointer group">
                            <div class="text-center space-y-2">
                                <div class="text-gray-400 group-hover:text-rose-500 transition text-4xl">
                                    <i class="fa-solid fa-cloud-arrow-up text-3xl mb-2"></i>
                                </div>
                                <div class="flex text-sm text-gray-600 justify-center">
                                    <span class="font-medium text-rose-600 hover:text-rose-500">Cliquez pour uploader</span>
                                    <p class="pl-1 text-xs md:text-sm">ou glissez-déposez</p>
                                </div>
                                <p class="text-xs text-gray-500">PNG, JPG jusqu'à 5MB</p>
                            </div>
                            <input required id="file-upload" name="image" type="file" class="sr-only" accept="image/png, image/jpeg, image/jpg">
                        </label>
                    </div>

                    <!-- Bouton Submit -->
                    <button type="submit" class="w-full bg-black text-white px-8 py-4 rounded-xl font-bold btn-premium text-lg">
                        Publier l'annonce
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Script pour ouvrir/fermer le menu mobile -->
    <script>
        const openBtn = document.getElementById('open-menu');
        const closeBtn = document.getElementById('close-menu');
        const sidebar = document.getElementById('mobile-sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
