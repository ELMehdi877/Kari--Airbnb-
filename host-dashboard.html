<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r p-6 hidden md:block">
            <h2 class="text-xl font-bold text-rose-500 mb-10">Mode Hôte</h2>
            <nav class="space-y-4">
                <a href="#" class="block p-3 bg-rose-50 text-rose-600 rounded-xl font-bold">Mes annonces</a>
                <a href="#" class="block p-3 hover:bg-gray-100 rounded-xl">Réservations</a>
                <a href="index.html" class="block p-3 hover:bg-gray-100 rounded-xl">Retour Voyageur</a>
            </nav>
        </aside>

        <main class="flex-1 p-10">
            <div class="max-w-3xl">
                <h1 class="text-3xl font-bold mb-8">Ajouter un nouveau logement</h1>
                <div class="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
                    <div>
                        <label class="block font-medium mb-2">Titre de l'annonce</label>
                        <input type="text" class="w-full border p-3 rounded-xl" placeholder="Ex: Maison de campagne paisible">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-medium mb-2">Prix par nuit (€)</label>
                            <input type="number" class="w-full border p-3 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-medium mb-2">Catégorie</label>
                            <select class="w-full border p-3 rounded-xl">
                                <option>Plage</option>
                                <option>Montagne</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium mb-2">Photos</label>
                        <div class="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center hover:border-rose-500 cursor-pointer transition">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                            <p>Cliquez pour télécharger des images</p>
                        </div>
                    </div>
                    <button class="bg-black text-white px-8 py-3 rounded-xl font-bold btn-premium">Publier l'annonce</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
