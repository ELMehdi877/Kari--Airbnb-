<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay | Premium Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideInRight 0.4s ease-out; }
        
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- NAVIGATION PRINCIPALE -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-gray-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight text-rose-500">LuxeStay</span>
            </div>

            <!-- Search Bar (Premium Style) -->
            <div class="hidden md:flex items-center border rounded-full px-4 py-2 shadow-sm hover:shadow-md transition cursor-pointer bg-white">
                <button class="px-4 font-medium border-r">N'importe où</button>
                <button class="px-4 font-medium border-r">Une semaine</button>
                <button class="px-4 text-gray-500">Ajouter des voyageurs</button>
                <div class="bg-rose-500 p-2 rounded-full text-white ml-2">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="showPage('host-dashboard')" class="hidden md:block font-medium hover:bg-gray-100 px-4 py-2 rounded-full transition">Mettre mon logement</button>
                <div class="flex items-center border rounded-full p-1 gap-3 hover:shadow-md transition cursor-pointer bg-white" onclick="toggleUserMenu()">
                    <i class="fa-solid fa-bars ml-3 text-gray-600"></i>
                    <div class="w-8 h-8 bg-gray-500 rounded-full flex items-center justify-center text-white overflow-hidden">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MENU DÉROULANT UTILISATEUR -->
    <div id="userMenu" class="hidden fixed top-20 right-10 w-64 bg-white rounded-2xl shadow-2xl z-[60] border border-gray-100 py-2 animate-fade-in">
        <a href="#" onclick="showPage('login')" class="block px-6 py-3 hover:bg-gray-50 font-semibold">Connexion</a>
        <a href="#" onclick="showPage('signup')" class="block px-6 py-3 hover:bg-gray-50">Inscription</a>
        <hr class="my-2">
        <a href="#" onclick="showPage('host-dashboard')" class="block px-6 py-3 hover:bg-gray-50">Mettre mon logement en ligne</a>
        <a href="#" onclick="showPage('admin-dashboard')" class="block px-6 py-3 hover:bg-gray-50">Administration</a>
        <a href="#" class="block px-6 py-3 hover:bg-gray-50">Aide</a>
    </div>

    <!-- CONTENU DYNAMIQUE -->
    <main id="main-content" class="pt-28 pb-20 px-6 max-w-7xl mx-auto">
        <!-- Les pages seront injectées ici par JS -->
    </main>

    <!-- FOOTER MOBILE -->
    <div class="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around py-3 z-50">
        <button onclick="showPage('home')" class="flex flex-col items-center text-rose-500">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px]">Explorer</span>
        </button>
        <button onclick="showPage('favorites')" class="flex flex-col items-center text-gray-400">
            <i class="fa-regular fa-heart text-xl"></i>
            <span class="text-[10px]">Favoris</span>
        </button>
        <button onclick="showPage('login')" class="flex flex-col items-center text-gray-400">
            <i class="fa-regular fa-circle-user text-xl"></i>
            <span class="text-[10px]">Profil</span>
        </button>
    </div>

    <script>
        // Logique de navigation simplifiée (SPA)
        function showPage(pageId) {
            const content = document.getElementById('main-content');
            document.getElementById('userMenu').classList.add('hidden');
            
            content.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-rose-500"></div></div>';
            
            setTimeout(() => {
                content.innerHTML = pages[pageId] || pages['home'];
                window.scrollTo(0,0);
            }, 300);
        }

        function toggleUserMenu() {
            document.getElementById('userMenu').classList.toggle('hidden');
        }

        const pages = {
            home: `
                <div class="animate-fade-in">
                    <!-- Categories -->
                    <div class="flex gap-10 overflow-x-auto no-scrollbar pb-4 mb-8">
                        ${['Piscines', 'Bord de mer', 'Campagne', 'Luxe', 'Cabanes', 'Design', 'Arctique'].map(cat => `
                            <div class="flex flex-col items-center gap-2 min-w-max cursor-pointer opacity-60 hover:opacity-100 border-b-2 border-transparent hover:border-black pb-2 transition">
                                <i class="fa-solid fa-house-chimney text-2xl"></i>
                                <span class="text-xs font-medium">${cat}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Grid Logements -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${[1,2,3,4,5,6,7,8].map(i => `
                            <div class="group cursor-pointer" onclick="showPage('detail')">
                                <div class="relative aspect-square overflow-hidden rounded-2xl mb-3">
                                    <img src="https://picsum.photos/seed/${i+10}/600/600" class="object-cover w-full h-full group-hover:scale-110 transition duration-500">
                                    <button class="absolute top-3 right-3 text-white text-xl hover:scale-110 transition"><i class="fa-regular fa-heart"></i></button>
                                </div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-semibold text-gray-900">Bali, Indonésie</h3>
                                    <div class="flex items-center gap-1 text-sm"><i class="fa-solid fa-star text-[10px]"></i> 4.92</div>
                                </div>
                                <p class="text-gray-500 text-sm">Vue sur les rizières</p>
                                <p class="text-gray-500 text-sm mb-1">12-17 oct.</p>
                                <p class="font-semibold text-gray-900">145 € <span class="font-normal">nuit</span></p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            detail: `
                <div class="animate-fade-in max-w-5xl mx-auto">
                    <h1 class="text-3xl font-semibold mb-4">Villa de Luxe avec Piscine à Débordement</h1>
                    <div class="flex justify-between items-end mb-6">
                        <div class="flex gap-4 text-sm underline font-medium">
                            <span>4,92 · 124 commentaires</span>
                            <span>Ubud, Bali, Indonésie</span>
                        </div>
                        <div class="flex gap-4">
                            <button class="hover:bg-gray-100 px-3 py-1 rounded-lg transition underline"><i class="fa-solid fa-share-nodes mr-2"></i>Partager</button>
                            <button class="hover:bg-gray-100 px-3 py-1 rounded-lg transition underline"><i class="fa-regular fa-heart mr-2"></i>Enregistrer</button>
                        </div>
                    </div>

                    <!-- Gallery Grid -->
                    <div class="grid grid-cols-4 grid-rows-2 gap-2 h-[450px] rounded-2xl overflow-hidden mb-8">
                        <div class="col-span-2 row-span-2"><img src="https://picsum.photos/seed/55/800/800" class="w-full h-full object-cover hover:opacity-90 cursor-pointer"></div>
                        <div class="col-span-1"><img src="https://picsum.photos/seed/56/400/400" class="w-full h-full object-cover hover:opacity-90 cursor-pointer"></div>
                        <div class="col-span-1"><img src="https://picsum.photos/seed/57/400/400" class="w-full h-full object-cover hover:opacity-90 cursor-pointer"></div>
                        <div class="col-span-1"><img src="https://picsum.photos/seed/58/400/400" class="w-full h-full object-cover hover:opacity-90 cursor-pointer"></div>
                        <div class="col-span-1"><img src="https://picsum.photos/seed/59/400/400" class="w-full h-full object-cover hover:opacity-90 cursor-pointer"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                        <div class="md:col-span-2">
                            <div class="flex justify-between items-center pb-6 border-b">
                                <div>
                                    <h2 class="text-2xl font-semibold">Logement entier : villa · Hôte : Wayan</h2>
                                    <p class="text-gray-600">6 voyageurs · 3 chambres · 3 lits · 3 salles de bain</p>
                                </div>
                                <img src="https://i.pravatar.cc/150?u=wayan" class="w-14 h-14 rounded-full">
                            </div>
                            <div class="py-8 space-y-6 border-b">
                                <div class="flex gap-4">
                                    <i class="fa-solid fa-medal text-2xl text-gray-700"></i>
                                    <div>
                                        <h4 class="font-semibold">Wayan est Superhôte</h4>
                                        <p class="text-gray-500 text-sm">Les Superhôtes sont des hôtes expérimentés.</p>
                                    </div>
                                </div>
                            </div>
                            <p class="py-8 text-gray-700 leading-relaxed">
                                Détendez-vous dans cette villa unique et tranquille. Profitez de la vue imprenable sur les rizières depuis votre piscine privée...
                            </p>
                        </div>

                        <!-- Booking Card -->
                        <div class="relative">
                            <div class="sticky top-32 p-6 border rounded-2xl shadow-xl bg-white">
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-2xl font-semibold">145 € <span class="text-base font-normal text-gray-500">nuit</span></span>
                                    <span class="text-sm font-medium"><i class="fa-solid fa-star"></i> 4,92</span>
                                </div>
                                <div class="border rounded-xl mb-4">
                                    <div class="grid grid-cols-2 border-b">
                                        <div class="p-3 border-r">
                                            <label class="block text-[10px] font-bold uppercase">Arrivée</label>
                                            <input type="text" value="12/10/2024" class="text-sm w-full outline-none">
                                        </div>
                                        <div class="p-3">
                                            <label class="block text-[10px] font-bold uppercase">Départ</label>
                                            <input type="text" value="17/10/2024" class="text-sm w-full outline-none">
                                        </div>
                                    </div>
                                    <div class="p-3">
                                        <label class="block text-[10px] font-bold uppercase">Voyageurs</label>
                                        <select class="text-sm w-full outline-none bg-transparent">
                                            <option>1 voyageur</option>
                                            <option>2 voyageurs</option>
                                        </select>
                                    </div>
                                </div>
                                <button class="w-full bg-rose-500 text-white py-3 rounded-xl font-semibold text-lg hover:bg-rose-600 transition mb-4">Réserver</button>
                                <p class="text-center text-sm text-gray-500">Aucun montant ne vous sera débité pour le moment</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            login: `
                <div class="max-w-md mx-auto mt-12 bg-white rounded-3xl shadow-2xl overflow-hidden animate-fade-in border">
                    <div class="px-8 py-6 border-b text-center relative">
                        <button onclick="showPage('home')" class="absolute left-6 top-6 hover:bg-gray-100 w-8 h-8 rounded-full"><i class="fa-solid fa-xmark"></i></button>
                        <h2 class="font-bold">Connexion ou inscription</h2>
                    </div>
                    <div class="p-8">
                        <h1 class="text-2xl font-semibold mb-6">Bienvenue sur LuxeStay</h1>
                        <div class="space-y-4">
                            <div class="border rounded-xl p-3 focus-within:ring-2 ring-black">
                                <label class="block text-xs text-gray-500">E-mail</label>
                                <input type="email" placeholder="nom@exemple.com" class="w-full outline-none py-1">
                            </div>
                            <div class="border rounded-xl p-3 focus-within:ring-2 ring-black">
                                <label class="block text-xs text-gray-500">Mot de passe</label>
                                <input type="password" placeholder="••••••••" class="w-full outline-none py-1">
                            </div>
                            <button class="w-full bg-rose-500 text-white py-4 rounded-xl font-bold hover:bg-rose-600 transition">Continuer</button>
                        </div>
                        <div class="flex items-center my-6">
                            <div class="flex-1 h-px bg-gray-200"></div>
                            <span class="px-4 text-xs text-gray-500 uppercase">ou</span>
                            <div class="flex-1 h-px bg-gray-200"></div>
                        </div>
                        <div class="space-y-3">
                            <button class="w-full border-2 border-gray-800 py-3 rounded-xl font-semibold flex items-center justify-center gap-4 hover:bg-gray-50 transition">
                                <i class="fa-brands fa-google text-xl text-blue-500"></i> Continuer avec Google
                            </button>
                            <button class="w-full border-2 border-gray-800 py-3 rounded-xl font-semibold flex items-center justify-center gap-4 hover:bg-gray-50 transition">
                                <i class="fa-brands fa-apple text-xl"></i> Continuer avec Apple
                            </button>
                        </div>
                    </div>
                </div>
            `,
            'host-dashboard': `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-10">
                        <h1 class="text-3xl font-bold">Tableau de bord Hôte</h1>
                        <button class="bg-black text-white px-6 py-3 rounded-xl font-medium">+ Créer une annonce</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                        <div class="p-6 bg-white border rounded-2xl shadow-sm">
                            <h3 class="text-gray-500 font-medium mb-2">Revenus ce mois-ci</h3>
                            <p class="text-3xl font-bold">2 450,00 €</p>
                            <span class="text-green-500 text-sm font-medium">↑ 12% vs mois dernier</span>
                        </div>
                        <div class="p-6 bg-white border rounded-2xl shadow-sm">
                            <h3 class="text-gray-500 font-medium mb-2">Réservations en cours</h3>
                            <p class="text-3xl font-bold">5</p>
                            <span class="text-gray-500 text-sm font-medium">Prochaine : demain</span>
                        </div>
                        <div class="p-6 bg-white border rounded-2xl shadow-sm">
                            <h3 class="text-gray-500 font-medium mb-2">Note globale</h3>
                            <p class="text-3xl font-bold">4.95 ★</p>
                            <span class="text-gray-500 text-sm font-medium">128 commentaires</span>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold mb-4">Vos annonces actives</h2>
                    <div class="bg-white border rounded-2xl overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Logement</th>
                                    <th class="px-6 py-4 font-semibold">Statut</th>
                                    <th class="px-6 py-4 font-semibold">Prix</th>
                                    <th class="px-6 py-4 font-semibold">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                <tr>
                                    <td class="px-6 py-4 flex items-center gap-3">
                                        <img src="https://picsum.photos/seed/1/50/50" class="rounded-lg">
                                        <span class="font-medium">Villa moderne à Bali</span>
                                    </td>
                                    <td class="px-6 py-4"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">Publié</span></td>
                                    <td class="px-6 py-4 font-medium">145 €/nuit</td>
                                    <td class="px-6 py-4">
                                        <button class="text-blue-600 hover:underline">Modifier</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            'admin-dashboard': `
                <div class="flex gap-8 animate-fade-in">
                    <div class="w-64 space-y-2">
                        <button class="w-full text-left px-4 py-3 bg-rose-50 rounded-xl text-rose-600 font-bold"><i class="fa-solid fa-chart-pie mr-3"></i>Vue d'ensemble</button>
                        <button class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-xl"><i class="fa-solid fa-users mr-3"></i>Utilisateurs</button>
                        <button class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-xl"><i class="fa-solid fa-hotel mr-3"></i>Logements</button>
                        <button class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-xl"><i class="fa-solid fa-flag mr-3"></i>Signalements</button>
                    </div>
                    <div class="flex-1">
                        <h1 class="text-3xl font-bold mb-8">Administration Système</h1>
                        <div class="grid grid-cols-4 gap-4 mb-8">
                             <div class="p-4 bg-blue-500 text-white rounded-2xl">
                                <p class="text-sm opacity-80">Total Ventes</p>
                                <p class="text-2xl font-bold">1.2M €</p>
                             </div>
                             <div class="p-4 bg-purple-500 text-white rounded-2xl">
                                <p class="text-sm opacity-80">Utilisateurs</p>
                                <p class="text-2xl font-bold">45.2k</p>
                             </div>
                        </div>
                        <div class="bg-white p-6 border rounded-2xl shadow-sm">
                            <h3 class="font-bold mb-4">Dernières vérifications d'identité</h3>
                            <div class="space-y-4">
                                ${[1,2,3].map(u => `
                                    <div class="flex items-center justify-between border-b pb-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 bg-gray-200 rounded-full"></div>
                                            <div>
                                                <p class="font-medium">Utilisateur #00${u}</p>
                                                <p class="text-xs text-gray-500">Inscrit il y a 2h</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-2">
                                            <button class="px-3 py-1 bg-green-500 text-white rounded-lg text-xs">Approuver</button>
                                            <button class="px-3 py-1 bg-gray-200 rounded-lg text-xs">Détails</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `,
            'favorites': `
                <div class="animate-fade-in">
                    <h1 class="text-3xl font-bold mb-8">Mes Favoris</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        <div class="group cursor-pointer">
                            <div class="relative aspect-square overflow-hidden rounded-2xl mb-3">
                                <img src="https://picsum.photos/seed/favorite/600/600" class="object-cover w-full h-full group-hover:scale-110 transition duration-500">
                                <button class="absolute top-3 right-3 text-rose-500 text-xl"><i class="fa-solid fa-heart"></i></button>
                            </div>
                            <h3 class="font-semibold">Appartement Design - Paris</h3>
                            <p class="font-semibold mt-1">210 € <span class="font-normal text-gray-500">nuit</span></p>
                        </div>
                    </div>
                </div>
            `
        };

        // Charger la page d'accueil par défaut
        window.onload = () => showPage('home');
    </script>
</body>
</html>
