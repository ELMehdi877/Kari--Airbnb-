<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-[2rem] shadow-2xl w-full max-w-md animate-up">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-rose-500">LuxeStay</h1>
            <p class="text-gray-500 mt-2">Heureux de vous revoir</p>
        </div>
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" class="w-full border p-3 rounded-xl outline-none focus:ring-2 ring-rose-500/20" placeholder="nom@exemple.com">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Mot de passe</label>
                <input type="password" class="w-full border p-3 rounded-xl outline-none focus:ring-2 ring-rose-500/20" placeholder="••••••••">
            </div>
            <button type="button" onclick="location.href='index.html'" class="w-full bg-rose-500 text-white p-3 rounded-xl font-bold btn-premium">Se connecter</button>
        </form>
        <p class="text-center mt-6 text-sm">Pas de compte ? <a href="signup.html" class="text-rose-500 font-bold">S'inscrire</a></p>
    </div>
</body>
</html>
