<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-white">
    <nav class="fixed top-0 w-full z-50 glass-nav px-8 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-rose-500">LuxeStay</div>
        
        <!-- Barre de recherche premium -->
        <div class="hidden md:flex items-center border shadow-sm rounded-full px-4 py-2 gap-4 hover:shadow-md transition cursor-pointer">
            <input type="text" placeholder="Où allez-vous ?" class="outline-none text-sm font-medium">
            <div class="h-6 w-px bg-gray-200"></div>
            <button class="bg-rose-500 text-white p-2 rounded-full"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="flex items-center gap-4">
            <a href="favorites.html" class="text-gray-600 hover:text-rose-500"><i class="fa-regular fa-heart text-xl"></i></a>
            <button onclick="location.href='host-dashboard.html'" class="text-sm font-medium">Passer en mode Hôte</button>
            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center cursor-pointer" onclick="location.href='admin-dashboard.html'"><i class="fa-solid fa-user-shield"></i></div>
        </div>
    </nav>

    <main class="pt-28 px-8 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Logement Card -->
            <div class="animate-up group cursor-pointer" onclick="location.href='detail.html'">
                <div class="relative overflow-hidden rounded-2xl aspect-square mb-3">
                    <img src="https://picsum.photos/seed/6/800/800" class="object-cover w-full h-full group-hover:scale-110 transition duration-500">
                    <button class="absolute top-4 right-4 text-white text-2xl fav-btn" onclick="event.stopPropagation(); toggleFav(this)">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>
                <div class="flex justify-between font-bold"><span>Santorini, Grèce</span> <span>4.9★</span></div>
                <p class="text-gray-500">Vue imprenable sur la mer</p>
                <p class="mt-1"><span class="font-bold">250 €</span> nuit</p>
            </div>
            <!-- Répéter les cartes ici -->
        </div>
    </main>

    <script>
        function toggleFav(btn) {
            const icon = btn.querySelector('i');
            icon.classList.toggle('fa-regular');
            icon.classList.toggle('fa-solid');
            icon.classList.toggle('text-rose-500');
        }
    </script>
</body>
</html>
