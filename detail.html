<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-24">
        <h1 class="text-3xl font-bold mb-4">Villa Méditerranéenne de Luxe</h1>
        <div class="grid grid-cols-4 gap-2 h-[400px] rounded-3xl overflow-hidden mb-10">
            <div class="col-span-2 h-full"><img src="https://picsum.photos/seed/10/800/800" class="w-full h-full object-cover"></div>
            <div class="grid grid-rows-2 gap-2 h-full col-span-2">
                <div class="grid grid-cols-2 gap-2">
                    <img src="https://picsum.photos/seed/11/400/400" class="w-full h-full object-cover">
                    <img src="https://picsum.photos/seed/12/400/400" class="w-full h-full object-cover">
                </div>
                <img src="https://picsum.photos/seed/13/800/400" class="w-full h-full object-cover">
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-16">
            <div class="flex-1">
                <h2 class="text-2xl font-bold border-b pb-6">Logement entier · Hôte : Elena</h2>
                <div class="py-8 space-y-6">
                    <div class="flex items-center gap-4"><i class="fa-solid fa-wifi text-xl"></i> <span>Wifi ultra-rapide</span></div>
                    <div class="flex items-center gap-4"><i class="fa-solid fa-swimming-pool text-xl"></i> <span>Piscine privée</span></div>
                </div>
                <p class="text-gray-600 leading-relaxed">Profitez d'un séjour inoubliable dans cette villa...</p>
            </div>

            <!-- Widget Réservation -->
            <div class="w-full md:w-[350px]">
                <div class="border rounded-2xl p-6 shadow-xl sticky top-28 bg-white">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-2xl font-bold">250 € <span class="text-sm font-normal">nuit</span></span>
                        <span class="text-sm font-bold">★ 4.9</span>
                    </div>
                    <button class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold btn-premium mb-4">Réserver maintenant</button>
                    <p class="text-center text-xs text-gray-400">Vous ne serez pas débité immédiatement</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
